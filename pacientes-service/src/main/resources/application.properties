spring.application.name=pacientes-service
server.port=8081

# PostgreSQL mediante R2DBC
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/hospital_pacientes
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD}

# Registro en Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Ejecutar schema.sql al iniciar
spring.sql.init.mode=always