name: CI - Registro de pacientes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-endpoint:
    name: Probar POST /api/pacientes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hospital_pacientes_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hospital_pacientes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: pacientes-service

    env:
      DB_USERNAME: postgres
      DB_PASSWORD: ci_test_password
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
          cache-dependency-path: pacientes-service/pom.xml

      - name: Compilar y probar el endpoint
        run: mvn -B -Dtest=PacienteEndpointTest verify